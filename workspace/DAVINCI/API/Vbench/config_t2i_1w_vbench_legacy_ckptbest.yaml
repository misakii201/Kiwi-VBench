# T2I finetune ckpt_best + legacy 推理参数 + VBench-2.0 全 18 维
# 生成：example/legacy_vbench_full.sh → run_vbench2_davinci worker（每卡加载一次 base+finetune）
# legacy 参数: cfg=6, seconds=4, 短 negative prompt, MAGI_DISABLE_SPATIAL_FIX=1

model:
  checkpoint_path: /kwkj-k8s/cy123/workspace/DAVINCI/output_train_t2i_1w_480x800_v1/ckpt_best.pt
  base_ckpt_dir: /kwkj-k8s/cy123/daVinci-MagiHuman-main/daVinci-MagiHuman-main/base
  config_load_path: /kwkj-k8s/cy123/workspace/DAVINCI/example/base/config_infer.json
  ckpt_blend_alpha: 1.0   # 先 load base，再用 finetune .pt 全量覆盖

params:
  seconds: 4.0
  br_width: 480
  br_height: 800
  fps: 25
  num_inference_steps: 32
  cfg_number: 2
  video_cfg_scale: 6.0
  audio_cfg_scale: 6.0
  negative_prompt: "static, blurred details, subtitles, overall gray, worst quality, low quality, jpeg artifacts, ugly, deformed, disfigured, messy background"
  t2v_freeze_audio: true
  use_sr: false

vbench2:
  prompts_dir: /kwkj-k8s/cy123/workspace/VBench/VBench-2.0/prompts/prompt
  prompts_aug_dir: /kwkj-k8s/cy123/workspace/VBench/VBench-2.0/prompts/prompt_aug/VBench2_aug_prompt
  output_dir: /kwkj-k8s/cy123/workspace/DAVINCI/output_vbench_t2i_1w_legacy_ckptbest
  dimensions: []          # 空 = 全部 18 维
  limit_prompts: 0        # 0 = 每维全部 prompt
  base_seed: 521

  parallel:
    gpus: "0,1,2,3,4,5,6,7"
    per_gpu_workers: 1
    base_master_port: 29800
    max_worker_restarts: 3
